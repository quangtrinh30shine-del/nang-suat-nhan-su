<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Năng suất nhân sự Vùng Quang</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* Layout theo mẫu báo cáo V7 (reports.30shine.com): thanh tiêu đề xanh đậm → tab dạng nút → thanh tab con xanh → khung lọc trắng → thẻ chỉ số viền trái → bảng tiêu đề xanh lục, dòng Tổng. Một giao diện sáng cố định như báo cáo gốc. */
:root{
  color-scheme:light;
  --navy:#173a8f; --navy-2:#1f47a6; --blue:#2f6fd0; --gold:#f2b705;
  --teal:#2f7a68; --paper:#f3f2f1; --white:#ffffff; --ink:#1d2433; --label:#1f3c88;
  --muted:#5f6675; --line:#e3e6ec; --row:#eef3fb; --note:#fdfbe6;
  --up:#1f8a4c; --down:#c62828; --wait:#b7791f; --keep:#2f5aa8; --none:#7b8291;
  --f:"Segoe UI",Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f);font-size:14px;line-height:1.45}
.top{background:var(--navy);color:var(--white)}
.top .in{max-width:1400px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.top .meta{font-size:13px;opacity:.9}
.pills{background:#eef1f8}
.pills .in{max-width:1400px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid #d5dbe8;background:var(--white);color:var(--navy);font:700 14px var(--f);text-transform:uppercase;padding:8px 18px;border-radius:999px;cursor:pointer}
.pill[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.subtabs{background:var(--navy-2)}
.subtabs .in{max-width:1400px;margin:0 auto;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap}
.sub{background:none;border:0;border-bottom:4px solid transparent;color:#dfe6fb;font:700 15px var(--f);text-transform:uppercase;padding:14px 22px 10px;cursor:pointer}
.sub[aria-selected="true"]{background:#3a63c4;color:var(--white);border-color:var(--gold)}
.filters{background:var(--white);border-bottom:1px solid var(--line)}
.filters .in{max-width:1400px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:170px}
.f span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
select,input,textarea{font:14px var(--f);color:var(--ink);background:var(--white);border:1px solid #cfd5df;border-radius:4px;padding:7px 10px}
textarea{font-family:Consolas,Menlo,monospace;font-size:12px;width:100%;min-height:150px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{font:700 14px var(--f);border-radius:4px;padding:8px 18px;border:0;background:#e9ebef;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);color:var(--white)}
.btn.out{background:var(--white);border:1px solid #cfd5df}
.btn.danger{background:var(--white);border:1px solid #e0a3a3;color:var(--down)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}
main{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:4px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
button.card{cursor:pointer}
button.card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue) inset}
.card .k{font-size:15px;font-weight:700;color:var(--label);text-transform:uppercase}
.card .v{font-size:30px;font-weight:700;color:#14213d;font-variant-numeric:tabular-nums}
.card .s{font-size:13px;color:var(--muted)}
.card.up{border-left-color:var(--up)}.card.up .s{color:var(--up)}
.card.wait{border-left-color:var(--wait)}
.card.keep{border-left-color:var(--keep)}
.card.down{border-left-color:var(--down)}.card.down .s{color:var(--down)}
.note{background:var(--note);border:1px solid #efe7b0;padding:9px 18px;font-style:italic;color:#4a4a3a}
.panel{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:6px;overflow:hidden}
.panel>header{background:var(--teal);color:var(--white);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel>header h2{margin:0;font-size:17px;font-weight:700;text-transform:uppercase}
.panel>header input{min-width:200px;border:0}
.panel .body{padding:14px 20px 18px}
.panel.purple{border-left-color:#5b2bb5}.panel.purple>header{background:#5b2bb5}
.panel.red{border-left-color:#a8323a}.panel.red>header{background:#a8323a}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.wide{min-width:1080px}
th{background:var(--row);color:var(--label);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid #d9e2f1;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right}
td.r,td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tong td{font-weight:700;border-top:2px solid var(--navy);background:#f7f9fc}
tbody tr:hover td{background:#f8fafd}
small{color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--white)}
.s-len{background:var(--up)}.s-cho{background:var(--wait)}.s-giu{background:var(--keep)}.s-xuong{background:var(--down)}.s-none,.s-thang{background:var(--none)}
.why{color:var(--muted);font-size:13px;max-width:320px}
.bad{color:var(--down);font-weight:700}
.good{color:var(--up);font-weight:700}
.nw{white-space:nowrap}
#t-nv td.why{min-width:230px}
.grid-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px;align-items:start}
tr.vung td{background:#fff6d6;font-weight:700}
.filters.chi-thang .f-an,.filters.chi-thang .btn{display:none}
.ex{font-size:10px;font-weight:700;color:var(--wait);border:1px solid var(--wait);border-radius:3px;padding:0 4px;margin-left:6px}
.empty{padding:30px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.grid2c{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.grid2c .panel{min-width:0}
.panel ul{margin:0;padding-left:18px}
.panel p{margin:8px 0 0;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:10px;color:var(--muted);font-size:13px}
dialog{border:0;border-radius:6px;background:var(--white);color:var(--ink);padding:0;width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,25,50,.45)}
.dlg>header{background:var(--navy);color:var(--white);padding:12px 18px;font-weight:700;text-transform:uppercase}
.dlg .bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.g2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0}
legend{font-size:12px;font-weight:700;color:var(--label);padding:0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--down)}
code{font-family:Consolas,Menlo,monospace;font-size:12px}
@media (max-width:560px){.top h1{font-size:18px}.card .v{font-size:24px}.sub{padding:12px 14px 8px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.khoa{position:fixed;inset:0;z-index:50;background:rgba(23,58,143,.96);display:flex;align-items:center;justify-content:center;padding:16px}
.khoa form{background:var(--white);border-radius:8px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.khoa h2{margin:0;color:var(--navy);font-size:18px;text-transform:uppercase}
.khoa label.nho{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
</style>
<style>
.wrapx{max-width:1400px;margin:0 auto;padding:16px}
.dt{font-size:12px;margin-left:6px}.dt.t{color:var(--up)}.dt.g{color:var(--down)}
th.sx{cursor:pointer}
tr.tong td{font-weight:700;background:var(--row)}
.kh{overflow-x:auto;background:var(--white);border:1px solid var(--line);margin-top:16px}
.loc{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.loc label{display:flex;flex-direction:column;font-size:13px;font-weight:700;color:var(--label);gap:4px}
.loc input,.loc select{font:14px var(--f);padding:6px 8px;border:1px solid #cfd6e4;border-radius:4px}
.note{margin-top:16px}
</style>

</form></div>

  const C=gom(tu,den),S=gom(stu,sden),N=D.nv;
  const lay=(M,fn)=>Object.keys(M).filter(k=>fn(N[k],k)).map(k=>M[k]);
  const hopVt=vt=>n=>n.vt===vt&&(!sl||n.salon===sl);
  const coSS=stu>=D.ngay[0];
  const henSS=coSS&&henDu(stu);
  // Thẻ tổng: mỗi chỉ số tính đúng trên vị trí áp dụng
  const tST=tong(lay(C,hopVt("stylist"))),tSK=tong(lay(C,hopVt("skinner"))),sST=tong(lay(S,hopVt("stylist"))),sSK=tong(lay(S,hopVt("skinner")));
  const c=chiSo(tST),s=chiSo(sST);
  $("cards").innerHTML=[["Upsale UND",so(tST.up+tSK.up),coSS?lech(tST.up+tSK.up,sST.up+sSK.up):"","Stylist + Skinner"],
    ["%UND / khách",hp(c.pund),coSS?lech(c.pund,s.pund,1):"","Chỉ Stylist"],
    ["% khách book",hp(c.pbook),coSS?lech(c.pbook,s.pbook,1):"","Khách book thợ, Stylist"],
    ["% hẹn lịch",hp(c.phen),henSS?lech(c.phen,s.phen,1):"","Hẹn lần sau, Stylist"],
    ["% book Skinner",hp(pt(tSK.skb,tSK.khach)),coSS?lech(pt(tSK.skb,tSK.khach),pt(sSK.skb,sSK.khach),1):"",so(tSK.skb)+" khách book"],
    ["DT mỹ phẩm",so(tST.sp+tSK.sp),coSS?lech(tST.sp+tSK.sp,sST.sp+sSK.sp):"","Stylist + Skinner"]]
    .map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[3]}${x[2]}</div></div>`).join("");
  let cot,dong;
  const cotChung=[["up","Upsale UND",0],["pund","%UND / khách",1],["pbook","% khách book",1],["phen","% hẹn lịch",1],["sp","DT mỹ phẩm",0]];
  if(view==="salon"){
    cot=[["ten","Salon"],["khach","Khách Stylist"],...cotChung.slice(0,4),["pskb","% book Skinner",1],cotChung[4]];
    dong=D.salons.filter(x=>!sl||x===sl).map(x=>{const f=vt=>n=>n.vt===vt&&n.salon===x;
      const a=tong(lay(C,f("stylist"))),b=tong(lay(C,f("skinner"))),a0=tong(lay(S,f("stylist"))),b0=tong(lay(S,f("skinner")));
      return{ten:x,c:{...chiSo(a),up:a.up+b.up,sp:a.sp+b.sp,pskb:pt(b.skb,b.khach)},s:{...chiSo(a0),up:a0.up+b0.up,sp:a0.sp+b0.sp,pskb:pt(b0.skb,b0.khach)}}});
  }else{
    const vt=view;cot=vt==="stylist"?[["ten","Nhân sự"],["sln","Salon"],["khach","Khách PV"],["book","Khách book",0],...cotChung]:[["ten","Nhân sự"],["sln","Salon"],["khach","Khách PV"],["skb","Khách book",0],["pskb","% khách book",1],["up","Upsale UND",0],["spa","Upsale Spa",0],["sp","DT mỹ phẩm",0]];
    // Người làm nhiều salon: chọn Tất cả thì gộp một dòng theo mã, salon nhiều khách nhất ghi trước; chọn một salon thì chỉ tính số ở salon đó
    const gop=M=>{const g={};Object.keys(M).filter(k=>hopVt(vt)(N[k],k)).forEach(k=>{(g[N[k].id]=g[N[k].id]||[]).push(k)});return g};
    const gC=gop(C),gS=gop(S);
    dong=Object.keys(gC).map(id=>{const ks=gC[id],c=tong(ks.map(k=>C[k]));const sal=[...ks].sort((x,y)=>C[y].khach-C[x].khach).map(k=>N[k].salon).join(", ");
      return{ten:N[ks[0]].ten+" · "+id,sln:sal,c:chiSo(c),s:gS[id]?chiSo(tong(gS[id].map(k=>S[k]))):null}}).filter(r=>r.c.khach>0);
  }
  const val=(r,k)=>k==="ten"||k==="sln"?r[k]:r.c[k];
  const key=sx.c&&cot.some(x=>x[0]===sx.c)?sx.c:null;
  dong.sort((a,b)=>{if(!key)return view==="salon"?0:(a.sln.localeCompare(b.sln)||(b.c.up-a.c.up));const x=val(a,key),y=val(b,key);if(typeof x==="string")return sx.g*x.localeCompare(y);return sx.g*((x??-1)-(y??-1))});
  const o=(r,k,laPt)=>{const v=r.c[k];const ht=laPt?hp(v):so(v);const sv=r.s&&coSS&&(k!=="phen"||henSS)?lech(v,r.s[k],laPt):"";return ht+sv};
  $("bang").innerHTML="<thead><tr>"+cot.map(x=>`<th class="sx ${x.length>2||x[0]==="khach"?"r":""}" data-c="${x[0]}">${x[1]}</th>`).join("")+"</tr></thead><tbody>"+
    dong.map(r=>"<tr>"+cot.map(x=>x[0]==="ten"||x[0]==="sln"?`<td>${r[x[0]]}</td>`:x[0]==="khach"?`<td class="r">${so(r.c.khach)}</td>`:`<td class="r">${o(r,x[0],x[2])}</td>`).join("")+"</tr>").join("")+"</tbody>";
  document.querySelectorAll("th.sx").forEach(t=>t.onclick=()=>{sx.g=sx.c===t.dataset.c?-sx.g:-1;sx.c=t.dataset.c;ve()});
  const henTu=D.hen_tu?D.hen_tu.split("-").reverse().join("/"):"";
  $("ghichu").innerHTML=`Upsale UND: tổng doanh thu upsale ngành Uốn/Nhuộm/Dưỡng (báo cáo 0019, Theo nhân viên). %UND / khách = số gói uốn, nhuộm, dưỡng / khách phục vụ, chỉ Stylist. % khách book Stylist = khách book đích danh / tổng khách của stylist trên báo cáo 0012. % khách book Skinner = lượt book skinner (báo cáo 0029) / khách phục vụ. % hẹn lịch = lượt hẹn lần sau / lượt nhận khách, có số từ ${henTu}. DT mỹ phẩm: doanh thu sản phẩm nhân sự bán. Upsale Spa (tab Skinner): doanh thu upsale ngành Relax/Spa. Không gồm Sup, nên tổng thấp hơn tổng salon. +/- so với cùng khoảng ngày tháng trước, chỉ số % ghi chênh theo điểm %. Số tính đến hết hôm qua. Người làm nhiều salon gộp một dòng khi chọn Tất cả, chọn một salon thì chỉ tính số ở salon đó.`+(view==="skinner"&&tSK.up===0?" Upsale UND của Skinner bằng 0 đúng theo báo cáo 0019: Skinner không có upsale ngành Uốn/Nhuộm/Dưỡng trong kỳ này.":"");
}
function datKy(tu,den){const a=D.ngay[0],b=D.ngay[D.ngay.length-1];$("tu").value=tu<a?a:tu;$("den").value=den>b?b:den;ve()}
function khoiDong(){
  const c=D.cap_nhat;$("meta").textContent=`Vùng Quang · 5 salon · Dữ liệu cập nhật: ${c.slice(11)} ${c.slice(0,10).split("-").reverse().join("/")}`;
  D.salons.forEach(s=>$("salon").add(new Option(s,s)));
  const b=D.ngay[D.ngay.length-1];
  $("tu").min=$("den").min=D.ngay[0];$("tu").max=$("den").max=b;
  ["tu","den","salon"].forEach(i=>$(i).onchange=ve);
  $("b-thang").onclick=()=>datKy(b.slice(0,8)+"01",b);
  $("b-truoc").onclick=()=>{const t=luiThang(b.slice(0,8)+"01"),m=t.slice(0,8);datKy(m+"01",m+new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7),0)).getUTCDate().toString().padStart(2,"0"))};
  document.querySelectorAll(".sub").forEach(t=>t.onclick=()=>{view=t.dataset.v;sx.c=null;document.querySelectorAll(".sub").forEach(x=>x.setAttribute("aria-selected",x===t));ve()});
  datKy(b.slice(0,8)+"01",b);
}
async function giaiMa(mk,enc){const h=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),te=new TextEncoder();
  const k0=await crypto.subtle.importKey("raw",te.encode(mk),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:h(enc.salt),iterations:enc.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:h(enc.iv)},k,h(enc.ct))))}
if(D&&D.enc){const enc=D.enc;D=null;$("khoa").hidden=false;
  const thu=async(mk,nho)=>{try{D=await giaiMa(mk,enc)}catch{return false}try{if(nho)localStorage.setItem("tb-mk",mk)}catch{}$("khoa").hidden=true;khoiDong();return true};
  let dl=null;try{dl=localStorage.getItem("tb-mk")}catch{}
  (async()=>{if(!(dl&&await thu(dl,false)))$("k-mk").focus()})();
  $("k-form").addEventListener("submit",async e=>{e.preventDefault();$("k-msg").textContent="Đang mở…";if(!await thu($("k-mk").value.trim(),$("k-nho").checked)){$("k-msg").textContent="Sai mật khẩu, anh/chị kiểm tra lại.";$("k-mk").select()}});
}else khoiDong();
})();
</script>
